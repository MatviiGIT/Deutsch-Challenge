name: Validate quiz

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check required lesson markup
        run: |
          grep -q 'id="lesson-screen"' index.html
          grep -q 'id="lesson-start-button"' index.html
