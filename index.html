<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Deutsch-Challenge – Test</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f8fafc;
      background: radial-gradient(circle at top left, #312e81 0, transparent 42%),
                  radial-gradient(circle at bottom right, #1d4ed8 0, transparent 40%), #0b1020;
    }
    main {
      width: min(100%, 620px); padding: clamp(24px, 5vw, 44px);
      border: 1px solid #ffffff24; border-radius: 24px;
      background: #111827d9; box-shadow: 0 24px 80px #0005; text-align: center;
    }
    .tag { color: #a5b4fc; text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; font-weight: 700; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: 14px 0; }
    p { color: #cbd5e1; line-height: 1.6; }
    button { border: 0; border-radius: 12px; padding: 14px 22px; margin-top: 12px; color: white; font: inherit; font-weight: 700; background: linear-gradient(100deg,#6366f1,#2563eb); cursor: pointer; }
    #status { min-height: 1.5em; color: #a5f3fc; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Technischer Test</div>
    <h1>Deutsch-Challenge</h1>
    <p>Wenn du diese Seite siehst, funktioniert die Testseite im Browser.</p>
    <button id="testButton" type="button">Funktion testen</button>
    <p id="status" role="status" aria-live="polite">Noch nicht getestet.</p>
    <p>Als Nächstes prüfen wir die Veröffentlichung und den Zugriff über das Schul-WLAN.</p>
  </main>
  <script>
    document.getElementById("testButton").addEventListener("click", () => {
      document.getElementById("status").textContent = "JavaScript funktioniert!";
    });
  </script>
</body>
</html>
